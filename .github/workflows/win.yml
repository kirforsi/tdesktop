name: Build DropGram Desktop

on:
  push:
    branches: [dev, master, main]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Everything that makes this build "yours" lives in this env block.
# Change values here - do not edit the steps below.
#
# Server settings are identical to the DropGram Android build.
# The RSA fingerprint is COMPUTED at runtime by tdesktop from the key
# (SHA1 of n+e, last 8 bytes) - nothing to hardcode, as long as your
# server sends the fingerprint matching the key below in resPQ.
# ---------------------------------------------------------------------------
env:
  SERVER_IPV4: "177.3.208.223"                # your Telegram server IP
  SERVER_IPV6: "fe80::91c9:ad67:3da3:4743"    # declared but link-local = never wins
  SERVER_PORT: "2398"                          # your Telegram server port
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

defaults:
  run:
    shell: cmd

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      # ------------------------------------------------------------------
      # Patches the freshly-checked-out tdesktop sources into DropGram:
      #   Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp
      #     1. kBuiltInDcs / kBuiltInDcsTest         -> your IP : port
      #     2. kBuiltInDcsIPv6 / kBuiltInDcsIPv6Test -> your IPv6 : port
      #     3. kPublicRSAKeys / kTestPublicRSAKeys   -> your RSA public key
      #     4. safety sweep of leftover Telegram IPs in Telegram/SourceFiles
      # ------------------------------------------------------------------
      - name: Patch DropGram server settings
        shell: bash
        working-directory: ${{ env.TBUILD }}/${{ env.REPO_NAME }}
        run: |
          PY=python
          command -v $PY >/dev/null 2>&1 || PY=py
          $PY - <<'PYEOF'
          #!/usr/bin/env python3
          """
          DropGram Desktop build-time patcher (runs inside the GitHub Actions patch step).

          Patches tdesktop (kirforsi fork, v7.3.3) so the client talks to your own
          server instead of Telegram's:

            * Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp
                kBuiltInDcs / kBuiltInDcsTest          -> your IPv4 : port
                kBuiltInDcsIPv6 / kBuiltInDcsIPv6Test  -> your IPv6 : port
                kPublicRSAKeys / kTestPublicRSAKeys    -> your RSA public key

            The key fingerprint is COMPUTED at runtime by tdesktop
            (RSAPublicKey::Private::computeFingerprint - SHA1 of n+e, last 8 bytes),
            so there is no hardcoded fingerprint to patch. As long as your server
            sends the fingerprint matching your key in resPQ, the handshake resolves.

            Plus a safety sweep of any leftover 149.154.*/91.108.*/95.161.76.100
            addresses anywhere under Telegram/SourceFiles.

          Line-ending safe: git checkout on Windows produces CRLF (core.autocrlf),
          on Linux LF - the file's own ending is detected and preserved.

          Idempotent: re-running on a patched tree converges to the same result.
          """
          import os
          import re
          import sys

          SERVER_IPV4 = os.environ.get("SERVER_IPV4", "177.3.208.223")
          SERVER_IPV6 = os.environ.get("SERVER_IPV6", "fe80::91c9:ad67:3da3:4743")
          SERVER_PORT = os.environ.get("SERVER_PORT", "2398")

          # Your server RSA public key (PKCS#1, without the PEM header/footer lines).
          # If your key ever changes, edit these lines.
          RSA_KEY_BODY = [
              "MIIBCgKCAQEAwRBimRGOEEa2sy1/gWi6NghKeiDdORt18eoDHiKD1HvJqqkzSiOG",
              "+FvbI+fRFy7FbOhoUlZyYVXuJMCuAlse20sW9j6SMPudjJwghFosXBK9aB4FVtII",
              "ZfljcKhlE8aqyC79BX68vDwziKJvMaJKCawurGSmEvjjc0R6wlqNGZmFbo1+B1zV",
              "mHR6Ji+PX1ArCDUl870Q8Uk4RtAl+xO4qm6Jv/9694RbJw/Kb3/R0nc4vYN4+oUq",
              "ikgXFyDw7ZLg10fbV6pwV8Grw2P8DI4rLE2lMQ6J0CXAl/3GdI0izHf6RMVc18LX",
              "RWrn7yD2r+2O3x8LqpBYcpQ3L76s6qDsdQIDAQAB",
          ]

          DC_PATH = "Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp"


          def fail(msg):
              sys.stderr.write("\n!!! PATCH ERROR: %s\n" % msg)
              sys.exit(1)


          if not os.path.isfile(DC_PATH):
              fail("%s not found - run this from the repository root" % DC_PATH)

          with open(DC_PATH, "r", encoding="utf-8", newline="") as f:
              src = f.read()

          # git checks out text files as CRLF on Windows runners (core.autocrlf=true)
          # and as LF on Linux. Detect this file's ending and preserve it everywhere.
          EOL = "\r\n" if "\r\n" in src else "\n"
          NL = r"\r?\n"  # in regexes: accept either line ending


          def key_block(varname):
              lines = (["-----BEGIN RSA PUBLIC KEY-----"]
                       + RSA_KEY_BODY
                       + ["-----END RSA PUBLIC KEY-----"])
              out = 'const char *' + varname + '[] = { "\\' + EOL
              for i, line in enumerate(lines):
                  if i < len(lines) - 1:
                      out += line + "\\n\\" + EOL
                  else:
                      out += line + '" };'
              return out


          def dc_table(name, ids, ip):
              new = 'const BuiltInDc ' + name + '[] = {' + EOL
              for dcid in ids:
                  new += '\t{ %s, "%s" , %s },' % (dcid, ip, SERVER_PORT) + EOL
              new += '};'
              return new


          # ===========================================================================
          # 1) built-in DC tables -> your server
          # ===========================================================================
          tables = {
              "kBuiltInDcs": ["1", "2", "3", "4", "5"],
              "kBuiltInDcsIPv6": ["1", "2", "3", "4", "5"],
              "kBuiltInDcsTest": ["1", "2", "3"],
              "kBuiltInDcsIPv6Test": ["1", "2", "3"],
          }
          for name, ids in tables.items():
              ip = SERVER_IPV6 if "IPv6" in name else SERVER_IPV4
              pat = re.compile(r'const BuiltInDc ' + name + r'\[\] = \{.*?\};', re.DOTALL)
              if not pat.search(src):
                  fail("DC table %s[] not found in %s" % (name, DC_PATH))
              src = pat.sub(lambda m: dc_table(name, ids, ip), src, count=1)

          # ===========================================================================
          # 2) built-in RSA public keys -> your key (both production and test tables)
          # ===========================================================================
          for varname in ("kTestPublicRSAKeys", "kPublicRSAKeys"):
              pat = re.compile(
                  r'const char \*' + varname + r'\[\] = \{ "\\'
                  + NL
                  + r'(?:[^\n]*\\n\\' + NL + r')*'
                  + r'-----END RSA PUBLIC KEY-----" \};'
              )
              if not pat.search(src):
                  fail("RSA key table %s[] not found in %s" % (varname, DC_PATH))
              src = pat.sub(lambda m: key_block(varname), src, count=1)

          with open(DC_PATH, "w", encoding="utf-8", newline="") as f:
              f.write(src)

          # ===========================================================================
          # 3) safety sweep: any leftover Telegram addresses in Telegram/SourceFiles
          # ===========================================================================
          swept = 0
          for root, dirs, files in os.walk("Telegram/SourceFiles"):
              for fname in files:
                  if not fname.endswith((".cpp", ".h")):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      with open(fpath, "r", encoding="utf-8", newline="") as f:
                          text = f.read()
                  except (OSError, UnicodeDecodeError):
                      continue
                  if not re.search(r'(149\.154\.|91\.108\.|95\.161\.76\.100)', text):
                      continue
                  newtext = re.sub(r'149\.154\.\d{1,3}\.\d{1,3}', SERVER_IPV4, text)
                  newtext = re.sub(r'91\.108\.\d{1,3}\.\d{1,3}', SERVER_IPV4, newtext)
                  newtext = newtext.replace("95.161.76.100", SERVER_IPV4)
                  if newtext != text:
                      with open(fpath, "w", encoding="utf-8", newline="") as f:
                          f.write(newtext)
                      swept += 1
                      print("swept leftover Telegram IPs in %s" % fpath)

          # ===========================================================================
          # 4) verify
          # ===========================================================================
          with open(DC_PATH, "r", encoding="utf-8", newline="") as f:
              final = f.read()

          for needle in ("149.154.", "91.108.", "95.161.76.100"):
              if needle in final:
                  fail("leftover Telegram address %r still in %s" % (needle, DC_PATH))
          if RSA_KEY_BODY[0] not in final:
              fail("your RSA public key was not injected into %s" % DC_PATH)
          if final.count("-----BEGIN RSA PUBLIC KEY-----") != 2:
              fail("expected exactly 2 PEM key blocks in %s, found %d"
                   % (DC_PATH, final.count("-----BEGIN RSA PUBLIC KEY-----")))
          for varname in ("kTestPublicRSAKeys", "kPublicRSAKeys"):
              if ('const char *' + varname + '[]') not in final:
                  fail("key table definition %s[] missing from %s" % (varname, DC_PATH))
              if key_block(varname) not in final:
                  fail("key table %s[] does not contain the expected generated block" % varname)
          for name, ids in tables.items():
              ip = SERVER_IPV6 if "IPv6" in name else SERVER_IPV4
              if dc_table(name, ids, ip) not in final:
                  fail("DC table %s[] does not contain the expected generated block" % name)
          if final.count('"' + SERVER_IPV4 + '"') < 5:
              fail("your server IP was not injected into the DC tables")

          print("line ending detected   : %s"
                % ("CRLF (Windows checkout)" if EOL == "\r\n" else "LF"))
          print("mtproto_dc_options.cpp : all DCs -> %s:%s (IPv6 %s declared)"
                % (SERVER_IPV4, SERVER_PORT, SERVER_IPV6))
          print("RSA key tables         : kPublicRSAKeys + kTestPublicRSAKeys -> your key")
          print("fingerprint            : computed at runtime from the key (nothing to patch)")
          print("files swept            : %d" % swept)
          print("Native patches applied OK")
          PYEOF

          echo ""
          echo "=================== PATCH SUMMARY ==================="
          sed -n '/const BuiltInDc kBuiltInDcs\[\]/,/^};/p' Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp
          sed -n '/const char \*kPublicRSAKeys\[\]/,/" };/p' Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp
          git --no-pager diff --stat || true
          echo "====================================================="

      - name: First set up
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Free up some disk space
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=611335 ^
          -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Debug --parallel

      - name: Move artifact
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          move %OUT%\Telegram.exe artifact/
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact/

      - name: List outputs
        if: always()
        shell: bash
        run: ls -la "${GITHUB_WORKSPACE}/TBuild/${REPO_NAME}/out/Debug" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DropGram-Desktop-x64
          path: artifact\
          retention-days: 7
